name: G2P API tests

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      SECRET_KEY: ci-only-not-a-secret
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_NAME: test_db
      DB_PORT: "3306"
      DB_ENGINE: django.db.backends.mysql
      PROJECT_CONFIG_PATH: ${{ github.workspace }}/gene2phenotype_project/test_config.ini
      USE_SQLITE_TEST_DB: "false"

    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt coverage==7.17.0

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
        working-directory: gene2phenotype_project

      - name: Run tests with coverage
        run: >-
          python -m coverage run
          --source=gene2phenotype_app
          --omit="*/tests/*"
          manage.py test gene2phenotype_app.tests
        working-directory: gene2phenotype_project

      - name: Generate coverage report
        run: python -m coverage xml -o coverage.cobertura.xml
        working-directory: gene2phenotype_project

      - name: Code coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: gene2phenotype_project/coverage.cobertura.xml
          format: markdown
          output: both
          fail_below_min: true
          thresholds: "80 90"

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f code-coverage-results.md ]; then
            cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
          fi
